# ShopHub - Full stack orchestration
# Usage: docker-compose up -d
# Backend: http://localhost:3001  Frontend: http://localhost:3000
#
# Required: Create .env in backend/ with DATABASE_URL, JWT_* secrets, etc.
# Or set env vars in docker-compose.yml / .env file at repo root.

version: "3.8"
name: shophub

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shophub-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopub
      FRONTEND_URL: http://localhost:3000
      # JWT_* and SMTP_* must be set via .env or env_file
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api
    container_name: shophub-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - backend

volumes:
  postgres_data:
